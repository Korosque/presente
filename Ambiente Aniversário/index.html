<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8f8">
  <meta name="description" content="Uma experiência de aniversário feita com carinho para Carolina Torres.">
  <title>Para Carolina, com amor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="site-noise" aria-hidden="true"></div>
  <div class="intro" id="intro">
    <div class="intro__sparkles" aria-hidden="true"><span>✦</span><span>♡</span><span>✧</span></div>
    <div class="bow bow--intro" aria-hidden="true"><i></i><b></b><i></i></div>
    <p class="eyebrow" data-site="introEyebrow"></p>
    <h1>Feliz aniversário,<br><em data-site="name"></em> <span>♥</span></h1>
    <p class="intro__lead" data-site="introMessage"></p>
    <button class="button button--primary" id="startButton" type="button">Começar nossa história <span>♥</span></button>
    <p class="scroll-hint">feito especialmente para você <span>↓</span></p>
  </div>

  <header class="topbar">
    <a class="brand" href="#inicio" aria-label="Voltar ao início"><span class="brand__mark">♥</span> <span data-site="brandLabel"></span></a>
    <nav aria-label="Navegação principal">
      <a href="#historia">Nossa história</a><a href="#galeria">Fotos</a><a href="#carta">Carta</a>
    </nav>
    <button class="music-button" id="musicButton" type="button" aria-label="Tocar música" title="Configure uma música em js/script.js"><span>♫</span><b>Tocar música</b></button>
    <audio id="backgroundMusic" loop preload="none"></audio>
  </header>

  <main id="inicio">
    <section class="hero section-shell reveal">
      <div class="hero__copy">
        <p class="eyebrow" data-site="heroEyebrow"></p>
        <h2 data-site="heroTitle"></h2>
        <p data-site="heroText"></p>
        <a class="text-link" href="#historia"><span data-site="heroLink"></span> <span>↓</span></a>
      </div>
      <div class="hero__portrait" aria-label="Uma das nossas fotos">
        <div class="hero__frame"><img src="assets/photos/photo-01.jpeg" alt="Momento especial de Carolina" fetchpriority="high"></div>
        <span class="hero__stamp">com<br>amor<br>♥</span>
        <span class="hero__caption">carolina<br><i>torres</i></span>
      </div>
    </section>

    <section class="section-shell story" id="historia">
      <div class="section-heading reveal"><p class="eyebrow" data-site="storyEyebrow"></p><h2 data-site="storyTitle"></h2></div>
      <div class="timeline" id="timeline"></div>
    </section>

    <section class="section-shell gallery-section" id="galeria">
      <div class="section-heading section-heading--row reveal"><div><p class="eyebrow" data-site="galleryEyebrow"></p><h2 data-site="galleryTitle"></h2></div><p class="section-heading__note" data-site="galleryNote"></p></div>
      <div class="gallery" id="gallery"></div>
    </section>

    <section class="letter-section" id="carta">
      <div class="section-shell letter-layout">
        <div class="section-heading reveal"><p class="eyebrow" data-site="letterEyebrow"></p><h2 data-site="letterTitle"></h2><p class="section-heading__note" data-site="letterNote"></p></div>
        <div class="envelope-wrap reveal"><button class="envelope" id="envelope" type="button" aria-expanded="false" aria-controls="letterPaper"><span class="envelope__back"></span><span class="envelope__paper" id="letterPaper"><strong data-site="envelopeLabel"></strong><span data-site="envelopeHint"></span></span><span class="envelope__flap"></span><span class="envelope__seal">♥</span></button><p class="envelope-hint" id="envelopeHint" data-site="envelopeClosedHint"></p></div>
        <article class="letter-paper" id="letterContent" hidden><p class="eyebrow" data-site="letterPaperEyebrow"></p><div id="letterText"></div><p class="letter-signature"><span data-site="letterSignature"></span><br><em data-site="letterAuthor"></em> ♥</p></article>
      </div>
    </section>

    <section class="section-shell moments" id="momentos"><div class="section-heading reveal"><p class="eyebrow" data-site="momentsEyebrow"></p><h2 data-site="momentsTitle"></h2></div><div class="moment-grid" id="moments"></div></section>

    <section class="finale"><div class="finale__hearts" aria-hidden="true"></div><div class="finale__content reveal"><div class="bow" aria-hidden="true"><i></i><b></b><i></i></div><p class="eyebrow" data-site="finalEyebrow"></p><h2 data-site="finalTitle"></h2><p id="finalMessage"></p><p class="finale__small" data-site="finalSmall"></p></div></section>
  </main>

  <div class="photo-modal" id="photoModal" role="dialog" aria-modal="true" aria-label="Foto ampliada" hidden><button class="modal-close" id="modalClose" type="button" aria-label="Fechar foto">×</button><button class="modal-arrow modal-arrow--prev" id="modalPrev" type="button" aria-label="Foto anterior">‹</button><figure><img id="modalImage" alt=""><figcaption id="modalCaption"></figcaption></figure><button class="modal-arrow modal-arrow--next" id="modalNext" type="button" aria-label="Próxima foto">›</button></div>
  <script src="js/site-data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
